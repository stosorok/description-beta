<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" id="themeColor" content="#f2f2f6" />
    <title>Опис 2.0</title>
    <link rel="apple-touch-icon" href="./icon.png" />
    <!-- Застосовуємо збережену тему одразу, щоб не було «мигання» -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("descTheme");
          if (t !== "dark" && t !== "light") {
            t =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="./style.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <!-- SPLASH -->
    <div id="splash" role="dialog" aria-label="Завантаження" aria-hidden="false">
      <div class="s-icon">
        <!-- 🔧 Іконку можна змінити тут -->
        <svg
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path
            d="m21.72 10.13-2.29 2.3c-.39.39-1.03.39-1.42 0l-.01-.02V18c0 1.65-1.35 3-3 3H9c-1.65 0-3-1.35-3-3v-5.59l-.01.02c-.39.39-1.03.39-1.42 0l-2.29-2.3c-.78-.78-.78-2.04 0-2.82l4.01-4.02C6.48 3.11 6.73 3 7 3h2c.31 0 .61.15.8.4.52.7 1.33 1.1 2.2 1.1s1.68-.4 2.2-1.1c.19-.25.49-.4.8-.4h2c.27 0 .52.11.71.29l4.01 4.02c.78.78.78 2.04 0 2.82z"
            fill="#ffffff"
          ></path>
        </svg>
      </div>
      <div class="s-title">Опис 2.0</div>
      <div class="s-sub">Генератор описів для лотів</div>
      <div class="s-loader"><span></span></div>
      <div class="s-ver">версія 2.0</div>
    </div>

    <div class="container hidden" id="app">
      <!-- Верхня панель -->
      <div class="topbar">
        <span></span>
        <h1>Опис 2.0</h1>
        <button
          type="button"
          class="theme-toggle"
          id="themeToggle"
          title="Світла / темна тема"
          aria-label="Змінити тему"
        >
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            />
          </svg>
        </button>
      </div>

      <div class="card">
        <!-- Ціна -->
        <div class="form-section">
          <label class="section" for="price">Ціна 💸</label>
          <input
            id="price"
            type="number"
            inputmode="decimal"
            step="0.01"
            placeholder="Наприклад: 450"
          />
          <div class="price-chips" id="priceChips">
            <button type="button" class="chip" data-price="220">220</button>
            <button type="button" class="chip" data-price="250">250</button>
            <button type="button" class="chip" data-price="270">270</button>
            <button type="button" class="chip" data-price="290">290</button>
            <button type="button" class="chip" data-price="320">320</button>
            <button type="button" class="chip" data-price="350">350</button>
            <button type="button" class="chip" data-price="370">370</button>
            <button type="button" class="chip" data-price="390">390</button>
            <button type="button" class="chip" data-price="450">450</button>
            <button type="button" class="chip" data-price="490">490</button>
            <button type="button" class="chip" data-price="550">550</button>
            <button type="button" class="chip" data-price="590">590</button>
          </div>
        </div>

        <!-- Бренд з автодопомогою -->
        <div class="form-section">
          <label class="section" for="brand">Бренд</label>
          <div class="autocomplete-wrap">
            <input
              id="brand"
              type="text"
              placeholder="Почніть вводити бренд..."
              autocomplete="off"
            />
            <div
              id="brandSuggestions"
              class="suggestions"
              style="display: none"
            ></div>
          </div>
        </div>

        <!-- Опис -->
        <div class="form-section">
          <label class="section" for="descInput">Опис</label>
          <input
            id="descInput"
            type="text"
            placeholder="Короткий опис у 1 реченні"
          />
        </div>

        <!-- Стан -->
        <div class="form-section">
          <label class="section">Стан</label>
          <div class="state pill-group">
            <label class="pill">
              <input type="radio" name="state" value="Стан чудовий" />
              <span>Стан чудовий</span>
            </label>
            <label class="pill">
              <input type="radio" name="state" value="Стан дуже хороший" />
              <span>Стан дуже хороший</span>
            </label>
            <label class="pill">
              <input type="radio" name="state" value="Стан новий з біркою" />
              <span>Новий з біркою</span>
            </label>
          </div>
          <div class="field-gap">
            <input
              id="defects"
              type="text"
              placeholder="Дефекти (необов'язково)"
            />
          </div>
        </div>

        <hr />

        <!-- Розмір -->
        <div class="form-section sizes">
          <label class="section">Розмір</label>
          <div class="pill-group">
            <label class="pill">
              <input type="checkbox" value="XXS" />
              <span>XXS</span>
            </label>
            <label class="pill">
              <input type="checkbox" value="XS" />
              <span>XS</span>
            </label>
            <label class="pill">
              <input type="checkbox" value="S" />
              <span>S</span>
            </label>
            <label class="pill">
              <input type="checkbox" value="M" />
              <span>M</span>
            </label>
            <label class="pill">
              <input type="checkbox" value="L" />
              <span>L</span>
            </label>
            <label class="pill">
              <input type="checkbox" value="XL" />
              <span>XL</span>
            </label>
            <label class="pill">
              <input type="checkbox" value="XXL" />
              <span>XXL</span>
            </label>
            <label class="pill">
              <input type="checkbox" value="XXXL" />
              <span>XXXL</span>
            </label>
            <label class="pill">
              <input type="checkbox" value="XXXXL" />
              <span>XXXXL</span>
            </label>
          </div>
        </div>

        <hr />

        <!-- Категорії -->
        <div class="form-section">
          <label class="section">Категорія</label>
          <div class="category-group" id="categoryGroup">
            <div class="category-pill" data-cat="sweater">Светр</div>
            <div class="category-pill" data-cat="pants">Штани</div>
            <div class="category-pill" data-cat="skirt">Спідниця</div>
            <div class="category-pill" data-cat="tshirt">Футболка</div>
            <div class="category-pill" data-cat="outerwear">Верхній одяг</div>
            <div class="category-pill" data-cat="dress">Сукня</div>
            <div class="category-pill" data-cat="accessories">Аксесуари</div>
          </div>
          <div id="categoryFields" class="cat-fields"></div>
        </div>

        <hr />

        <!-- Матеріали -->
        <div class="form-section materials">
          <label class="section">Матеріал</label>
          <label class="pill"><input type="checkbox" value="бавовна" /><span>Бавовна</span></label>
          <label class="pill"><input type="checkbox" value="віскоза" /><span>Віскоза</span></label>
          <label class="pill"><input type="checkbox" value="еластан" /><span>Еластан</span></label>
          <label class="pill"><input type="checkbox" value="вовна" /><span>Вовна</span></label>
          <label class="pill"><input type="checkbox" value="кашемір" /><span>Кашемір</span></label>
          <label class="pill"><input type="checkbox" value="нейлон" /><span>Нейлон</span></label>
          <label class="pill"><input type="checkbox" value="поліамід" /><span>Поліамід</span></label>
          <label class="pill"><input type="checkbox" value="акрил" /><span>Акрил</span></label>
          <label class="pill"><input type="checkbox" value="поліестер" /><span>Поліестер</span></label>
          <label class="pill"><input type="checkbox" value="льон" /><span>Льон</span></label>
          <label class="pill"><input type="checkbox" value="альпака" /><span>Альпака</span></label>
          <label class="pill"><input type="checkbox" value="мохер" /><span>Мохер</span></label>
          <label class="pill"><input type="checkbox" value="меринос" /><span>Меринос</span></label>
          <label class="pill"><input type="checkbox" value="шовк" /><span>Шовк</span></label>
          <label class="pill"><input type="checkbox" value="екошкіра" /><span>Екошкіра</span></label>
          <label class="pill"><input type="checkbox" value="ліоцел" /><span>Ліоцел</span></label>
          <label class="pill"><input type="checkbox" value="модал" /><span>Модал</span></label>
          <label class="pill"><input type="checkbox" value="купро" /><span>Купро</span></label>
          <label class="pill"><input type="checkbox" value="мереживо" /><span>Мереживо</span></label>
          <label class="pill"><input type="checkbox" value="сатин" /><span>Сатин</span></label>
          <label class="pill"><input type="checkbox" value="велюр" /><span>Велюр</span></label>
          <label class="pill"><input type="checkbox" value="сітка" /><span>Сітка</span></label>
          <label class="pill"><input type="checkbox" value="вельвет" /><span>Вельвет</span></label>
          <label class="pill"><input type="checkbox" value="замш" /><span>Замш</span></label>
          <label class="pill"><input type="checkbox" value="люрекс" /><span>Люрекс</span></label>
          <label class="pill"><input type="checkbox" value="муслін" /><span>Муслін</span></label>
          <label class="pill"><input type="checkbox" value="шифон" /><span>Шифон</span></label>
          <div class="field-gap materials-custom">
            <input id="materialCustom" type="text" placeholder="Інший матеріал" />
          </div>
        </div>
      </div>

      <!-- Кнопки -->
      <div class="form-section actions">
        <button id="btnGenerate" class="btn">Генерувати</button>
        <button id="btnCopy" class="btn secondary">Копіювати</button>
        <button id="btnSave" class="btn dark">Зберегти</button>
      </div>

      <!-- Output -->
      <div class="form-section">
        <textarea id="output" readonly></textarea>
      </div>

      <!-- Збережені (акордеони) -->
      <div id="savedList"></div>

      <div class="clear-all-wrap">
        <button id="btnClearAll" class="btn-danger">🗑 Видалити все</button>
      </div>
    </div>

    <!-- floating clear -->
    <button class="fab-clear" id="fabClear" title="Очистити поля">
      <svg
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <path
          d="M3 6h18v2H3V6zm2 3h14v12H5V9zm3 2v8h2v-8H8zm4 0v8h2v-8h-2zM9 4V2h6v2h5v2H4V4h5z"
        />
      </svg>
    </button>
  </body>
</html>
